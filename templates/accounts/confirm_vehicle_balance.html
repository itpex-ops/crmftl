{% extends 'layouts/base.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
    body {
        background: #f4f6fb;
    }

    .transfer-wrapper {
        max-width: 350px;
        margin: auto;
    }

    .payment-card {
        border: none;
        border-radius: 18px;
        overflow: hidden;
    }

    .payment-header {
        background: linear-gradient(135deg, #198754, #28a745);
        color: white;
        text-align: center;
        padding: 6px;
        font-size: 14px;
        font-weight: 500;
    }

    .amount-box {
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        color: #198754;
        margin-bottom: 15px;
    }

    .beneficiary-card {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 10px;
        margin-bottom: 12px;
    }

    .detail-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        gap: 10px;
    }

    .detail-row:last-child {
        margin-bottom: 0;
    }

    .detail-row strong {
        font-size: 12px;
    }

    .detail-row span {
        font-size: 12px;
        font-weight: 500;
        text-align: right;
        word-break: break-all;
    }

    .form-label {
        font-size: 12px;
        font-weight: 500;
    }

    .form-select,
    .form-control {
        height: 38px;
        border-radius: 10px;
        font-size: 13px;
    }

    .pay-btn {
        width: 100%;
        height: 38px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
    }
</style>

<div class="container py-2">
    <div class="transfer-wrapper">

        <div class="card payment-card shadow">

            <div class="payment-header">
                Confirm Balance Payment
            </div>

            <div class="card-body">

                <div class="text-center mb-3">

                    <div class="fw-bold">
                        {{ vehicle.vehicle_number }}
                    </div>

                    <div class="amount-box">
                        ₹ {{ amount }}
                    </div>

                </div>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">
                            Payment Mode
                        </label>

                        <select name="payment_mode" id="paymentMode" class="form-select" required>
                            <option value="">Select Payment Mode</option>
                            <option value="bank">Bank Transfer</option>
                            <option value="upi">UPI</option>
                        </select>
                    </div>

                    <!-- BANK DETAILS -->
                    <div id="bankDetails" class="beneficiary-card">

                        <div class="detail-row">
                            <strong>Account Name</strong>
                            <span>{{ vehicle.account_name }}</span>
                        </div>

                        <div class="detail-row">
                            <strong>A/C No</strong>
                            <span>{{ vehicle.account_number }}</span>
                        </div>

                        <div class="detail-row">
                            <strong>IFSC</strong>
                            <span>{{ vehicle.ifsc }}</span>
                        </div>

                    </div>

                    <!-- UPI DETAILS -->
                    <div id="upiDetails" class="beneficiary-card" style="display:none;">

                        <div class="detail-row">
                            <strong>UPI ID</strong>
                            <span>{{ vehicle.upi_id }}</span>
                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Reference Number
                        </label>

                        <input type="text" class="form-control" value="{{ preview_utr }}" readonly>

                    </div>

                    <input type="hidden" name="transaction_no" value="{{ preview_utr }}">

                    <button type="submit" class="btn btn-success pay-btn">

                        <i class="bi bi-check-circle me-1"></i>
                        Confirm Balance Payment

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const paymentMode = document.getElementById("paymentMode");
        const bankDetails = document.getElementById("bankDetails");
        const upiDetails = document.getElementById("upiDetails");

        function togglePaymentDetails() {

            bankDetails.style.display = "none";
            upiDetails.style.display = "none";

            if (paymentMode.value === "bank") {
                bankDetails.style.display = "block";
            }
            else if (paymentMode.value === "upi") {
                upiDetails.style.display = "block";
            }
        }

        paymentMode.addEventListener("change", togglePaymentDetails);

        // Initial load
        togglePaymentDetails();
    });
</script>

{% endblock %}
