{% extends 'layouts/base.html' %}
{% block content %}

<style>
.success-card{
    max-width:350px;
    margin:auto;
    border:none;
    border-radius:18px;
}

.success-icon{
    font-size:60px;
    color:#198754;
}

.utr-box{
    background:#f8f9fa;
    border-radius:10px;
    padding:10px;
    font-weight:600;
}
</style>

<div class="container py-4">

    <div class="card shadow success-card">

        <div class="card-body text-center">

            <div class="success-icon">
                ✅
            </div>

            <h5 class="mt-2">
                Balance Payment Successful
            </h5>

            <p class="text-muted mb-3">
                Amount transferred successfully.
            </p>

            <div class="utr-box mb-3">
                UTR : {{ utr }}
            </div>

            <div class="mb-3">
                <strong>{{ vehicle.vehicle_number }}</strong>
            </div>

            <a href="{% url 'vehicle_payments' vehicle.id %}"
               class="btn btn-success w-100">
                View Payments
            </a>

        </div>

    </div>

</div>

{% endblock %}
