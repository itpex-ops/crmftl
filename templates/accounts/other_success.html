{% extends 'layouts/base.html' %}
{% block content %}

<div class="container py-4">

    <div class="payment-wrapper">

        <div class="card shadow text-center">

            <div class="card-body">

                <div class="mb-3">

                    <i class="bi bi-check-circle-fill
                              text-success"
                       style="font-size:60px;">
                    </i>

                </div>

                <h4 class="text-success">
                    Payment Successful
                </h4>

                <hr>

                <p>
                    <strong>Vehicle :</strong>
                    {{ vehicle.vehicle_number }}
                </p>

                <p>
                    <strong>Amount :</strong>
                    ₹{{ transaction.amount }}
                </p>

                <p>
                    <strong>UTR :</strong>
                    {{ transaction.transaction_no }}
                </p>

                <p>
                    <strong>Mode :</strong>
                    {{ transaction.payment_mode|upper }}
                </p>

                <a href="{% url 'vehicle_payments' vehicle.id %}"
                   class="btn btn-primary">
                    Back
                </a>

            </div>

        </div>

    </div>

</div>
<style>
    body {
        background: #f4f6fb;
    }

    .payment-wrapper,
    .transfer-wrapper {
        max-width: 380px;
        margin: auto;
    }

    .payment-card {
        border: none;
        border-radius: 18px;
        overflow: hidden;
    }

    .payment-header {
        background: linear-gradient(135deg, #198754, #28a745);
        color: #fff;
        text-align: center;
        padding: 8px;
        font-size: 14px;
        font-weight: 600;
    }

    .vehicle-number {
        font-size: 15px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 8px;
    }

    .amount-box {
        text-align: center;
        font-size: 24px;
        font-weight: 700;
        color: #198754;
        margin-bottom: 15px;
    }

    .form-label {
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
    }

    .form-control,
    .form-select {
        height: 40px;
        border-radius: 10px;
        font-size: 13px;
    }

    .pay-btn {
        width: 100%;
        height: 40px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
    }

    .beneficiary-card {
        background: #f8f9fa;
        border: 1px solid #e9ecef;
        border-radius: 12px;
        padding: 10px;
        margin-bottom: 12px;
    }

    .detail-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
        gap: 10px;
    }

    .detail-row:last-child {
        margin-bottom: 0;
    }

    .detail-row strong {
        font-size: 12px;
        color: #666;
    }

    .detail-row span {
        font-size: 12px;
        font-weight: 600;
        text-align: right;
        word-break: break-word;
    }

    .success-icon {
        font-size: 65px;
        color: #28a745;
    }

    .success-card {
        border: none;
        border-radius: 18px;
    }

    .success-title {
        color: #28a745;
        font-size: 20px;
        font-weight: 700;
    }

    .success-details {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 12px;
        margin-top: 15px;
    }

    .success-details .detail-row {
        border-bottom: 1px solid #eee;
        padding: 6px 0;
    }

    .success-details .detail-row:last-child {
        border-bottom: none;
    }

    .utr-box {
        background: #e8f5e9;
        color: #198754;
        font-weight: 700;
        border-radius: 8px;
        padding: 8px;
        text-align: center;
        font-size: 13px;
    }

    @media (max-width: 576px) {

        .payment-wrapper,
        .transfer-wrapper {
            max-width: 100%;
        }

        .card-body {
            padding: 14px;
        }

        .amount-box {
            font-size: 20px;
        }

        .pay-btn,
        .form-control,
        .form-select {
            height: 38px;
        }
    }
</style>
{% endblock %}
