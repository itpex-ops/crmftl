{% extends 'layouts/base.html' %}
{% block content %}

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
    body {
        background: #f4f6fb;
    }

    .success-wrapper {
        max-width: 500px;
        margin: auto;
    }

    .success-card {
        border: none;
        border-radius: 24px;
        overflow: hidden;
        background: #fff;
    }

    .success-header {
        background: linear-gradient(135deg, #00a651, #2ecc71);
        padding: 40px 20px;
        text-align: center;
        color: #fff;
    }

    .success-icon {
        width: 100px;
        height: 100px;
        margin: auto;
        background: rgba(255, 255, 255, .15);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
    }

    .success-icon i {
        font-size: 60px;
        color: #fff;
    }

    .success-title {
        margin-top: 18px;
        font-size: 28px;
        font-weight: 700;
    }

    .success-subtitle {
        opacity: .95;
        margin-top: 6px;
    }

    .transaction-box {
        background: #f8f9fc;
        border: 1px solid #ececec;
        border-radius: 18px;
        padding: 20px;
        margin-top: 20px;
        text-align: center;
    }

    .transaction-label {
        color: #888;
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 8px;
    }

    .utr-number {
        font-size: 22px;
        font-weight: 700;
        color: #222;
        word-break: break-all;
    }

    .status-chip {
        display: inline-block;
        background: #e9f9ee;
        color: #00a651;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 30px;
        margin-top: 15px;
    }

    .ledger-btn {
        width: 100%;
        height: 56px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, #6a1b9a, #9c27b0);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 25px;
        transition: .3s;
    }

    .ledger-btn:hover {
        color: #fff;
        transform: translateY(-2px);
    }

    .secure-text {
        text-align: center;
        color: #888;
        font-size: 13px;
        margin-top: 18px;
    }

    @media(max-width:576px) {

        .container {
            padding-left: 12px;
            padding-right: 12px;
        }

        .success-title {
            font-size: 24px;
        }

        .utr-number {
            font-size: 18px;
        }

    }
</style>

<div class="container py-4">

    <div class="success-wrapper">

        <div class="card shadow success-card">

            <div class="success-header">

                <div class="success-icon">
                    <i class="bi bi-check-lg"></i>
                </div>

                <div class="success-title">
                    Transaction Successful
                </div>

                <div class="success-subtitle">
                    Advance Payment Completed Successfully
                </div>

            </div>

            <div class="card-body p-4">

                <div class="status-chip">
                    ✓ Amount Credited
                </div>

                <div class="transaction-box">

                    <div class="transaction-label">
                        UTR Number
                    </div>

                    <div class="utr-number">
                        {{ utr }}
                    </div>

                </div>

                <a href="{% url 'vehicle_payments' vehicle.id %}" class="ledger-btn">

                    <i class="bi bi-journal-text me-2"></i>
                    View Payment Ledger

                </a>

                <div class="secure-text">
                    🔒 Secure Banking Transaction Completed
                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
