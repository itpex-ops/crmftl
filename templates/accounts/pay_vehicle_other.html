{% extends 'layouts/base.html' %}
{% block content %}

<style>
    body {
        background: #f4f6fb;
    }

    .payment-wrapper {
        max-width: 380px;
        margin: auto;
    }

    .payment-card {
        border: none;
        border-radius: 18px;
        overflow: hidden;
    }

    .payment-header {
        background: linear-gradient(135deg, #198754, #28a745);
        color: #fff;
        text-align: center;
        padding: 8px;
        font-size: 14px;
        font-weight: 600;
    }

    .vehicle-info {
        text-align: center;
        margin-bottom: 15px;
    }

    .vehicle-number {
        font-size: 15px;
        font-weight: 600;
        color: #333;
    }

    .form-label {
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
    }

    .form-control,
    .form-select {
        height: 40px;
        border-radius: 10px;
        font-size: 13px;
    }

    .pay-btn {
        width: 100%;
        height: 40px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
    }

    @media (max-width: 576px) {

        .payment-wrapper {
            max-width: 100%;
        }

        .card-body {
            padding: 14px;
        }

        .pay-btn,
        .form-control,
        .form-select {
            height: 38px;
        }
    }
</style>

<div class="container py-3">

    <div class="payment-wrapper">

        <div class="card payment-card shadow">

            <div class="payment-header">
                Other Payment
            </div>

            <div class="card-body">

                <div class="vehicle-info">
                    <div class="vehicle-number">
                        {{ vehicle.vehicle_number }}
                    </div>
                </div>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">
                            Amount
                        </label>

                        <input type="number"
                               step="0.01"
                               name="amount"
                               class="form-control"
                               placeholder="Enter amount"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Payment Type
                        </label>

                        <select name="transaction_type"
                                class="form-select"
                                required>

                            <option value="">
                                Select Type
                            </option>

                            <option value="fuel">
                                Fuel
                            </option>

                            <option value="driver_advance">
                                Driver Advance
                            </option>

                            <option value="toll">
                                Toll
                            </option>

                            <option value="maintenance">
                                Maintenance
                            </option>

                            <option value="rent">
                                Vehicle Rent
                            </option>

                            <option value="others">
                                Others
                            </option>

                        </select>
                    </div>

                    <button type="submit"
                            class="btn btn-primary pay-btn">
                        Continue
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
