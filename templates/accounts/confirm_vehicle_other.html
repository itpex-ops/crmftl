{% extends 'layouts/base.html' %}
{% block content %}

<div class="container py-3">

    <div class="transfer-wrapper">

        <div class="card payment-card shadow">

            <div class="payment-header">
                Confirm Other Payment
            </div>

            <div class="card-body">

                <div class="text-center mb-3">

                    <div class="fw-bold">
                        {{ vehicle.vehicle_number }}
                    </div>

                    <div class="amount-box">
                        ₹ {{ amount }}
                    </div>

                </div>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">
                            Payment Mode
                        </label>

                        <select name="payment_mode" id="paymentMode" class="form-select">

                            <option value="">
                                Select
                            </option>

                            <option value="bank">
                                Bank Transfer
                            </option>

                            <option value="upi">
                                UPI
                            </option>

                            <option value="cash">
                                Cash
                            </option>

                        </select>
                    </div>

                    <div id="bankDetails" class="beneficiary-card" style="display:none;">

                        <div class="detail-row">
                            <strong>Account Name</strong>
                            <span>{{ vehicle.account_name }}</span>
                        </div>

                        <div class="detail-row">
                            <strong>A/C No</strong>
                            <span>{{ vehicle.account_number }}</span>
                        </div>

                        <div class="detail-row">
                            <strong>IFSC</strong>
                            <span>{{ vehicle.ifsc }}</span>
                        </div>

                    </div>

                    <div id="upiDetails" class="beneficiary-card" style="display:none;">

                        <div class="detail-row">
                            <strong>UPI ID</strong>
                            <span>{{ vehicle.upi_id }}</span>
                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Reference Number
                        </label>

                        <input type="text" class="form-control" value="{{ preview_utr }}" readonly>

                    </div>

                    <button type="submit" class="btn btn-success pay-btn">
                        Confirm Transfer
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<script>

    document.addEventListener("DOMContentLoaded", function () {

        const paymentMode =
            document.getElementById("paymentMode");

        const bankDetails =
            document.getElementById("bankDetails");

        const upiDetails =
            document.getElementById("upiDetails");

        paymentMode.addEventListener("change", function () {

            bankDetails.style.display = "none";
            upiDetails.style.display = "none";

            if (this.value === "bank") {
                bankDetails.style.display = "block";
            }

            if (this.value === "upi") {
                upiDetails.style.display = "block";
            }

        });

    });

</script>
<style>
    body {
        background: #f4f6fb;
    }

    .payment-wrapper,
    .transfer-wrapper {
        max-width: 380px;
        margin: auto;
    }

    .payment-card {
        border: none;
        border-radius: 18px;
        overflow: hidden;
    }

    .payment-header {
        background: linear-gradient(135deg, #198754, #28a745);
        color: #fff;
        text-align: center;
        padding: 8px;
        font-size: 14px;
        font-weight: 600;
    }

    .vehicle-number {
        font-size: 15px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 8px;
    }

    .amount-box {
        text-align: center;
        font-size: 24px;
        font-weight: 700;
        color: #198754;
        margin-bottom: 15px;
    }

    .form-label {
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
    }

    .form-control,
    .form-select {
        height: 40px;
        border-radius: 10px;
        font-size: 13px;
    }

    .pay-btn {
        width: 100%;
        height: 40px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
    }

    .beneficiary-card {
        background: #f8f9fa;
        border: 1px solid #e9ecef;
        border-radius: 12px;
        padding: 10px;
        margin-bottom: 12px;
    }

    .detail-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
        gap: 10px;
    }

    .detail-row:last-child {
        margin-bottom: 0;
    }

    .detail-row strong {
        font-size: 12px;
        color: #666;
    }

    .detail-row span {
        font-size: 12px;
        font-weight: 600;
        text-align: right;
        word-break: break-word;
    }

    .success-icon {
        font-size: 65px;
        color: #28a745;
    }

    .success-card {
        border: none;
        border-radius: 18px;
    }

    .success-title {
        color: #28a745;
        font-size: 20px;
        font-weight: 700;
    }

    .success-details {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 12px;
        margin-top: 15px;
    }

    .success-details .detail-row {
        border-bottom: 1px solid #eee;
        padding: 6px 0;
    }

    .success-details .detail-row:last-child {
        border-bottom: none;
    }

    .utr-box {
        background: #e8f5e9;
        color: #198754;
        font-weight: 700;
        border-radius: 8px;
        padding: 8px;
        text-align: center;
        font-size: 13px;
    }

    @media (max-width: 576px) {

        .payment-wrapper,
        .transfer-wrapper {
            max-width: 100%;
        }

        .card-body {
            padding: 14px;
        }

        .amount-box {
            font-size: 20px;
        }

        .pay-btn,
        .form-control,
        .form-select {
            height: 38px;
        }
    }
</style>
{% endblock %}
