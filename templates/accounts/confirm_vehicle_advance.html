{% extends 'layouts/base.html' %}
{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
    body {
        background: #f4f6fb;
    }

    .transfer-btn {
        width: 100%;
        height: 56px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, #6a1b9a, #9c27b0);
        color: #fff;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: 0.3px;
        transition: all 0.3s ease;
    }

    .transfer-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(156, 39, 176, 0.25);
    }

    .transfer-btn:active {
        transform: scale(0.98);
    }

    .transfer-wrapper {
        max-width: 500px;
        margin: auto;
    }

    .yono-card {
        border: none;
        border-radius: 24px;
        overflow: hidden;
        background: #fff;
    }

    .yono-header {
        background: linear-gradient(135deg, #6a1b9a, #9c27b0);
        color: white;
        padding: 30px 25px;
        text-align: center;
    }

    .yono-header small {
        opacity: .9;
        letter-spacing: 1px;
    }

    .amount-box {
        font-size: 2.3rem;
        font-weight: 700;
        margin-top: 10px;
    }

    .beneficiary-card {
        background: #faf7fd;
        border: 1px solid #eee;
        border-radius: 18px;
        padding: 18px;
        margin-bottom: 20px;
    }

    .detail-label {
        font-size: 12px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: .5px;
    }

    .detail-value {
        font-size: 15px;
        font-weight: 600;
        color: #222;
        margin-bottom: 14px;
        word-break: break-word;
    }

    .form-label {
        font-weight: 600;
        margin-bottom: 8px;
    }

    .form-select,
    .form-control {
        height: 52px;
        border-radius: 14px;
        border: 1px solid #ddd;
        font-size: 15px;
    }

    .form-select:focus,
    .form-control:focus {
        box-shadow: 0 0 0 3px rgba(156, 39, 176, 0.15);
        border-color: #9c27b0;
    }

    .transfer-btn {
        width: 100%;
        height: 56px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, #6a1b9a, #9c27b0);
        color: white;
        font-weight: 700;
        font-size: 16px;
        transition: .3s;
    }

    .transfer-btn:hover {
        transform: translateY(-2px);
    }

    .secure-note {
        text-align: center;
        color: #777;
        font-size: 13px;
        margin-top: 15px;
    }

    @media (max-width: 576px) {
        .container {
            padding-left: 10px;
            padding-right: 10px;
        }

        .amount-box {
            font-size: 1.9rem;
        }

        .yono-header {
            padding: 25px 20px;
        }
    }
</style>

<div class="container py-4">

    <div class="transfer-wrapper">

        <div class="card shadow yono-card">

            <!-- Header -->
            <div class="yono-header">

                <small>CONFIRM TRANSFER</small>

                <div class="amount-box">
                    ₹ {{ amount }}
                </div>

            </div>

            <div class="card-body p-4">

                <!-- Beneficiary Details -->
                <div class="beneficiary-card">

                    <div class="detail-label">
                        Beneficiary Name
                    </div>

                    <div class="detail-value">
                        {{ vehicle.beneficiary_name }}
                    </div>

                    <div class="detail-label">
                        Account Number
                    </div>

                    <div class="detail-value">
                        {{ vehicle.account_number }}
                    </div>

                    <div class="detail-label">
                        IFSC Code
                    </div>

                    <div class="detail-value">
                        {{ vehicle.ifsc }}
                    </div>

                </div>

                <!-- Form -->
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">
                            Payment Mode
                        </label>

                        <select name="payment_mode" class="form-select">
                            <option value="bank">
                                Bank Transfer
                            </option>

                            <option value="upi">
                                UPI
                            </option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            Reference Number
                        </label>

                        <input type="text" class="form-control" value="{{ preview_utr }}" readonly>
                    </div><input type="hidden" name="transaction_no">

                    <button type="submit" class="transfer-btn">
                        <i class="bi bi-shield-check me-2"></i>
                        Confirm & Transfer
                    </button>

                </form>

                <div class="secure-note">
                    🔒 Secured Banking Transaction
                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
