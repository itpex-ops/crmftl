{% extends 'layouts/base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm">

        <div class="card-header bg-primary text-white">

            <h5 class="mb-0">
                Balance Payment
            </h5>

        </div>

        <div class="card-body">

            <div class="mb-3">

                <strong>Vehicle:</strong>
                {{ vehicle.vehicle_number }}

            </div>

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Amount
                    </label>

                    <input type="number"
                           step="0.01"
                           name="amount"
                           class="form-control"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Payment Mode
                    </label>

                    <select name="payment_mode"
                            class="form-select">

                        <option value="upi">UPI</option>
                        <option value="bank">Bank Transfer</option>
                        <option value="cash">Cash</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Transaction Number
                    </label>

                    <input type="text"
                           name="transaction_no"
                           class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Remarks
                    </label>

                    <textarea name="remarks"
                              rows="3"
                              class="form-control"></textarea>

                </div>

                <button type="submit"
                        class="btn btn-primary">

                    <i class="bi bi-wallet2"></i>
                    Save Balance Payment

                </button>

                <a href="{% url 'vehicle_payments' vehicle.id %}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
