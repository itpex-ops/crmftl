{% load static %}
<html><head>
    <style>
        body {
            background: #f5f7fb;
        }
        .navbar-brand {
            font-weight: 700;
        }
        .card {
            border: 0;
            box-shadow: 0 2px 10px yellow;
        }
        .section-title {
            font-weight: 700;
            border-left: 4px solid #0d6efd;
            padding-left: 10px;
        }
        .table thead th {
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="page-header d-flex justify-content-between align-items-center flex-wrap">
        {% if messages %}
        {% for m in messages %}
        <div class="alert alert-{{ m.tags }} alert-dismissible fade show shadow-sm" role="alert">
            {% if m.tags == 'success' %}
            <i class="bi bi-check-circle-fill me-2"></i>
            {% elif m.tags == 'error' %}
            <i class="bi bi-x-circle-fill me-2"></i>
            {% elif m.tags == 'warning' %}
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            {% elif m.tags == 'info' %}
            <i class="bi bi-info-circle-fill me-2"></i>
            {% endif %}
            {{ m }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        <div>
        <div class="container py-4">
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'onepageorder_list' %}">Orders</a>
                <a class="nav-link" href="{% url 'vehicle_payments' %}">Vehicle Payments</a>
                <a class="nav-link" href="{% url 'customer_payments' %}">Customer Payments</a>
                <a class="nav-link" href="{% url 'admin_margin' %}">Admin Margin</a>
                <a class="nav-link" href="#">Reports</a>
            </div>
        </div>
    </nav>
    <!-- <main class="container py-4">
        {% for message in messages %}
            <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main> -->

</body>
</html>
