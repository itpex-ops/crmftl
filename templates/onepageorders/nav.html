{% load static %}
<html><head>
    <style>
        body {
            background: #f5f7fb;
        }
        .navbar-brand {
            font-weight: 700;

            box-shadow: 0 2px 10px yellow;
        }
        .section-title {
            font-weight: 700;
            border-left: 4px solid #0d6efd;

<body>

            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'onepageorder_create' %}">New Order</a>
                <a class="nav-link" href="{% url 'vehicle_accounts' %}">Vehicle Payments</a>

                <a class="nav-link" href="#">Admin Margin</a>
            </div>
        </div>
    </nav>
    <main class="container py-4">
        {% for message in messages %}
            <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>

</html>
