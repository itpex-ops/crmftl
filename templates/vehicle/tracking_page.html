{% extends 'layouts/base.html' %}
{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm border-0 p-3 mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h4 class="fw-bold mb-1">📍 Vehicle Tracking</h4>
                <small class="text-muted">
                    {{ vehicle.vehicle_number }} | Order : {{ vehicle.order_no }}
                </small>
            </div>

            <a href="javascript:history.back()" class="btn btn-light border">
                Cancel
            </a>
        </div>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="card shadow-sm border-0 p-4">

            <div class="track-item">
                <label class="track-label">
                    <input type="checkbox" name="vehicle_placed"
                           {% if tracking.vehicle_placed %}checked{% endif %}>
                    🚚 Vehicle Placed
                </label>
            </div>

            <div class="track-item">
                <label class="track-label">
                    <input type="checkbox" name="vehicle_document"
                           {% if tracking.vehicle_document %}checked{% endif %}>
                    📄 Vehicle Document Collected
                </label>
            </div>

            <div class="track-item">
                <label class="track-label">
                    <input type="checkbox" name="invoice_eway"
                           {% if tracking.invoice_eway %}checked{% endif %}>
                    🧾 Invoice / E-way
                </label>
            </div>

            <div class="track-item">
                <label class="track-label">
                    <input type="checkbox" name="advance_to_fleet"
                           {% if tracking.advance_to_fleet %}checked{% endif %}>
                    💰 Advance To Fleet
                </label>
            </div>

            <div class="track-item">
                <label class="track-label">
                    <input type="checkbox" name="fleet_departed"
                           {% if tracking.fleet_departed %}checked{% endif %}>
                    🚛 Fleet Departed
                </label>
            </div>

            <div class="track-item">
                <label class="track-label">
                    <input type="checkbox" name="advance_received"
                           {% if tracking.advance_received %}checked{% endif %}>
                    💵 Advance Received
                </label>
            </div>

            <div class="track-item">
                <label class="track-label">
                    <input type="checkbox" name="arrived"
                           {% if tracking.arrived %}checked{% endif %}>
                    📍 Arrived
                </label>
            </div>

            <div class="track-item">
                <label class="track-label">
                    <input type="checkbox" name="delivered"
                           {% if tracking.delivered %}checked{% endif %}>
                    ✅ Delivered
                </label>
            </div>

            <div class="track-item">
                <label class="track-label">
                    <input type="checkbox" name="pod_received"
                           {% if tracking.pod_received %}checked{% endif %}>
                    📦 POD Received
                </label>
            </div>

            <div class="track-item">
                <label class="track-label">
                    <input type="checkbox" name="settled"
                           {% if tracking.settled %}checked{% endif %}>
                    🧮 Settled
                </label>
            </div>

            <div class="mt-4">
                <label class="fw-semibold mb-2">Remarks</label>

                <textarea
                    name="remarks"
                    rows="4"
                    class="form-control">{{ tracking.remarks }}</textarea>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-success">
                    💾 Save
                </button>
            </div>

        </div>

    </form>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const checkboxes = document.querySelectorAll(
        ".track-item input[type='checkbox']"
    );

    checkboxes.forEach(box => {

        box.addEventListener("change", function () {

            if (this.checked) {

                checkboxes.forEach(other => {

                    if (other !== this) {
                        other.checked = false;
                    }

                });

            }

        });

    });

});
</script>

<style>
.track-item{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
    background:#fafafa;
}

.track-label{
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    width:100%;
    margin:0;
}

.track-label input{
    width:18px;
    height:18px;
}
</style>

{% endblock %}
